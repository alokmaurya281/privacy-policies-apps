<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Deletion Request</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:0;
}
.container{
    max-width:600px;
    margin:60px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
h1{
    text-align:center;
}
p{
    color:#555;
}
input, textarea{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}
button{
    width:100%;
    padding:12px;
    background:#2d89ff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#1b6ed6;
}
.footer{
    text-align:center;
    margin-top:20px;
    font-size:14px;
    color:#777;
}
</style>
</head>
<body>

<div class="container">
<h1>Account Deletion Request</h1>

<p>If you want to delete your account and all associated data from our app, please submit the request below.</p>

<form action="mailto:snmaurya10275@gmail.com" method="post" enctype="text/plain">

<label>Your Email</label>
<input type="email" name="email" required>

<label>User ID (optional)</label>
<input type="text" name="userid">

<label>Reason (optional)</label>
<textarea name="reason" rows="4"></textarea>

<button type="submit">Request Account Deletion</button>

</form>

<div class="footer">
<p>We will process your request within 7 days.</p>
</div>
</div>

</body>
</html>
