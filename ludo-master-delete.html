<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Account - Ludo Master</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0b1a3a, #1a2f6b);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 100%;
  max-width: 500px;
}

.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  padding: 25px;
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.1);
}

h1 {
  text-align: center;
  color: #FFD700;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
}

button {
  margin-top: 15px;
  width: 100%;
  padding: 12px;
  background: linear-gradient(45deg, red, darkred);
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.note {
  margin-top: 15px;
  font-size: 13px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>Delete Account</h1>

<p>Request deletion of your Ludo Master account and all associated data.</p>

<form action="mailto:snmaurya10275@gmail.com" method="post" enctype="text/plain">

<input type="text" name="name" placeholder="Your Name" required>
<input type="email" name="email" placeholder="Your Email" required>

<textarea name="reason" placeholder="Reason (optional)"></textarea>

<button type="submit">Delete My Account</button>

</form>

<p class="note">
⚠️ Your data will be permanently deleted within 3–5 working days.
</p>

</div>
</div>

</body>
</html>
